name: Build and Release

on:
  push:
    branches:
      - "Neo/1.21.1"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Read Version
        id: gradle_props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/neoformruntime
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Shared CI runner IPs get rate limited by third-party mod mavens, so a build that
      # only failed while downloading dependencies is retried instead of failing the release.
      - name: Build
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::Gradle build (attempt ${attempt}/3)"
            if ./gradlew build --stacktrace 2>&1 | tee "gradle-attempt-${attempt}.log"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"

            if ! grep -qE "Could not resolve|Could not GET|Too Many Requests|Read timed out|Connection reset" "gradle-attempt-${attempt}.log"; then
              echo "Build failed for a reason other than dependency downloads. Not retrying."
              exit 1
            fi

            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 45))
              echo "Dependency download failed. Retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          echo "Build still failing after 3 attempts."
          exit 1

      - name: Create Tag
        run: |
          TAG="v${{ steps.gradle_props.outputs.release_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, reusing it."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gradle_props.outputs.release_version }}
          name: AE2_Useful_Utilities v${{ steps.gradle_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
