plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${mod_group_id}"
base {
    archivesName = "${mod_named}"
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = "${neoversion}"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', "${modid}"
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${modid}"
        }

        data {
            clientData()
            programArguments.addAll '--mod', "${modid}", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArgument '-Xmx2G'
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "appeng"
            includeGroup "de.mari_023"
        }
    }
}

dependencies {
    // Applied Energistics 2
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "org.appliedenergistics:guideme:${guideme_version}"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

    // Curios API (optional integration)
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // AE Infinity Booster
     runtimeOnly "curse.maven:aeinfinitybooster-559313:${aeib_version_id}"
}

// Expand version properties into the neoforge.mods.toml template.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mcversion       : mcversion,
            mcversion_range : mcversion_range,
            mod_version     : mod_version,
            modid           : modid,
            author          : author,
            mod_named       : mod_named,
            mod_name        : mod_name,
            tag_lanzador    : tag_lanzador,
            description     : project.findProperty('description'),
            license         : license,
            neoversion      : neoversion,
            loader_version  : loader_version,
            guideme_version : guideme_version,
            ae2_version     : ae2_version,
            curios_version  : curios_version,
            aeib_version_id : aeib_version_id,
    ]
    inputs.properties replaceProperties
   
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

}


test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title"    : "${mod_named}",
                "Specification-Vendor"   : "${author}",
                "Specification-Version"  : "1",
                "Implementation-Title"   : "${mod_named}",
                "Implementation-Version" : "${version}",
                "Implementation-Vendor"  : "${author}",
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.getRelease().set(25)
}
